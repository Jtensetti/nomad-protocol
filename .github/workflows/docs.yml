name: docs
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  # A superseded run tells nobody anything: it is testing a candidate that has
  # already been replaced, while consuming a runner the new candidate needs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_docs.py
